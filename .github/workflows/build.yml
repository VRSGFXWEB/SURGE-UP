
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil project
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ekstrak project
        run: |
          unzip -o SurgeUp-Beta-ready-to-build.zip -d .
          test -f SurgeUp/app/build.gradle.kts

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: SurgeUp
        run: gradle assembleDebug --no-daemon

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: SurgeUp-debug-apk
          path: SurgeUp/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
