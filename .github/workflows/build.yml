
name: Build SurgeUp APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'SURGEUP/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android Project
        run: |
          GRADLEW=$(find SURGEUP -type f -name gradlew -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew tidak ditemukan!"
            echo "Periksa apakah ZIP berisi Gradle Wrapper."
            find SURGEUP -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project ditemukan di: $PROJECT_DIR"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SurgeUp-APK
          path: |
            SURGEUP/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
